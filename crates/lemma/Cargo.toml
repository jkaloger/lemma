[package]
name = "lemma"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "Hooks binary for the lemma lazyspec workflow pack."

[dependencies]
lazyspec = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
globset = "0.4"
toml = "0.8"
anyhow = "1"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tempfile = "3"

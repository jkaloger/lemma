[[types]]
name = "spec"
plural = "specs"
dir = "docs/specs"
prefix = "SPEC"
subdirectory = true
staleness = "drift"
lifecycle = { states = ["draft", "active"], edges = [{ from = "draft", to = "active" }] }

[[types]]
name = "delta"
plural = "deltas"
dir = "docs/deltas"
prefix = "DELTA"
subdirectory = true
staleness = "age"
lifecycle = { states = ["draft", "in-progress", "complete"], edges = [{ from = "draft", to = "in-progress" }, { from = "in-progress", to = "complete" }] }

[[types]]
name = "decision"
plural = "decisions"
dir = "docs/decisions"
prefix = "DECISION"
staleness = "age"
lifecycle = { states = ["proposed", "accepted", "superseded"], edges = [{ from = "proposed", to = "accepted" }, { from = "accepted", to = "superseded" }] }

[[types]]
name = "convention"
plural = "convention"
dir = "docs/convention"
prefix = "CONVENTION"
singleton = true
staleness = "drift"
lifecycle = { states = ["draft", "accepted"], edges = [{ from = "draft", to = "accepted" }] }

[[types]]
name = "dictum"
plural = "dicta"
dir = "docs/convention"
prefix = "DICTUM"
parent_type = "convention"
staleness = "drift"
lifecycle = { states = ["draft", "accepted"], edges = [{ from = "draft", to = "accepted" }] }

[[relationships]]
name = "folds-into"
inverse = "folded-from"

[[relationships]]
name = "affects"
inverse = "affected-by"

[[relationships]]
name = "constrains"
inverse = "constrained-by"

[[relationships]]
name = "supersedes"
inverse = "superseded-by"

[[edges]]
name = "delta-folds-into-spec"
from = "delta"
to = "spec"
via = "folds-into"
required = "error"

[[edges]]
name = "decision-affects-spec"
from = "decision"
to = "spec"
via = "affects"

[[edges]]
name = "decision-constrains-spec"
from = "decision"
to = "spec"
via = "constrains"

[[edges]]
name = "dictum-constrains-spec"
from = "dictum"
to = "spec"
via = "constrains"

[[edges]]
name = "decision-supersedes-decision"
from = "decision"
to = "decision"
via = "supersedes"

# `unowned` is omitted: the ungoverned-file check is off.
[governs]
scope = ["src/**", "crates/**", "lib/**"]

[templates]
dir = ".lazyspec/templates"

[[hooks]]
name = "lemma-validate"
event = "validate"
types = ["spec", "delta", "decision", "dictum"]
run = ["lemma", "check", "--hook"]

[[hooks]]
name = "lemma-intent-gate"
event = "pre-transition"
types = ["delta"]
from = "draft"
to = "in-progress"
context_types = ["spec", "delta"]
run = ["lemma", "check", "--hook", "--require", "intent"]

[[hooks]]
name = "lemma-check-gate"
event = "pre-transition"
types = ["delta"]
from = "in-progress"
to = "complete"
context_types = ["spec", "delta"]
run = ["lemma", "check", "--hook", "--require", "evidence", "--require", "clean"]

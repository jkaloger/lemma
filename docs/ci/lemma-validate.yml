# Copy to .github/workflows/lemma-validate.yml in an adopting repository.
name: lemma-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and dictum checks diff test regions against the base revision
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install lazyspec lemma --locked
      # Hook trust is per machine, so the job runs it.
      - run: lazyspec hook trust
      - name: lemma lint (pull request)
        if: github.event_name == 'pull_request'
        run: lemma lint --base origin/${{ github.base_ref }}
      - name: lemma lint (push to the default branch)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          before=${{ github.event.before }}
          git fetch --no-tags origin "$before" || true
          if git cat-file -e "$before^{commit}" 2>/dev/null && git merge-base --is-ancestor "$before" HEAD; then
            lemma lint --base "$before"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            # first push or force-push: the old tip is unusable, so check the tip commit alone
            lemma lint --base "$(git rev-parse HEAD^)"
          fi
      - name: lemma lint (push to another branch)
        if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
        run: |
          git fetch --no-tags origin ${{ github.event.repository.default_branch }}
          lemma lint --trunk origin/${{ github.event.repository.default_branch }}
      # lazyspec validate exits 2 on any error finding, including those from the lemma validate hook.
      - run: lazyspec validate

# Copy to .github/workflows/lemma-validate.yml in an adopting repository.
name: lemma-validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check 2 diffs evidence regions against the base revision
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install lazyspec lemma --locked
      # Hook trust is per machine, so the job runs it.
      - run: lazyspec hook trust
      - name: lemma check (pull request)
        if: github.event_name == 'pull_request'
        run: lemma check --base origin/${{ github.base_ref }}
      - name: lemma check (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: lemma check --base ${{ github.event.before }}
      - name: lemma check (new branch)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: lemma check
      # lazyspec validate exits 2 on any error finding, including those from the lemma validate hook.
      - run: lazyspec validate

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
      <title id="workflow-title">Lemma delta workflow</title>
      <desc id="workflow-desc">Swimlane diagram of a delta moving from draft through review, planning and a per-task build loop to complete, with human and agent steps in separate lanes.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525b65"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3386d3"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f3f5"/>
      <rect x="0" y="176" width="800" height="256" fill="#eceef0"/>
      <line x1="0" y1="176" x2="800" y2="176" stroke="#c7ccd1" stroke-width="1"/>

      <!-- connectors -->
      <g fill="none" stroke="#525b65" stroke-width="1" marker-end="url(#arrow)">
        <path d="M120 160 V260 q0 8 8 8 H156"/>
        <path d="M172 232 V160"/>
        <path d="M252 160 V232"/>
        <path d="M268 124 H276 q8 0 8 8 V260 q0 8 8 8 H300"/>
        <path d="M356 232 V160"/>
        <path d="M412 124 H452 q8 0 8 8 V200"/>
        <path d="M540 278 H572"/>
        <path d="M616 304 V332"/>
        <path d="M572 358 H540"/>
        <path d="M468 332 V304"/>
        <path d="M676 300 H730 q8 0 8 -8 V160"/>
      </g>
      <g stroke="#525b65" stroke-width="1" marker-end="url(#arrow)">
        <line x1="412" y1="24" x2="436" y2="24"/>
        <line x1="676" y1="24" x2="700" y2="24"/>
      </g>

      <!-- label masks -->
      <rect x="178" y="190" width="68" height="14" rx="2" fill="#eceef0"/>
      <rect x="476" y="311" width="52" height="14" rx="2" fill="#dae4ed"/>

      <!-- status strip -->
      <rect x="24" y="12" width="388" height="24" rx="4" fill="#ffffff" stroke="#091b28"/>
      <rect x="436" y="12" width="240" height="24" rx="4" fill="rgba(51,134,211,0.10)" stroke="#3386d3"/>
      <rect x="700" y="12" width="76" height="24" rx="4" fill="#e3e6e9" stroke="#525b65"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="0.14em" text-anchor="middle" fill="#091b28">
        <text x="218" y="28">STATUS · DRAFT</text>
        <text x="556" y="28">IN-PROGRESS</text>
        <text x="738" y="28">COMPLETE</text>
      </g>

      <!-- lane labels -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="0.14em" fill="#525b65">
        <text x="24" y="76">HUMAN</text>
        <text x="776" y="76" text-anchor="end" letter-spacing="0.04em">lazyspec update &lt;id&gt; --status complete</text>
        <text x="24" y="196">LEMMA · AGENT</text>
        <text x="212" y="200" text-anchor="middle" letter-spacing="0.06em">UNTIL CLEAN</text>
        <text x="502" y="321" text-anchor="middle" letter-spacing="0.06em">NEXT TASK</text>
      </g>

      <!-- human steps -->
      <g fill="#ffffff" stroke="#091b28" stroke-width="1">
        <rect x="24" y="88" width="108" height="72" rx="6"/>
        <rect x="156" y="88" width="112" height="72" rx="6"/>
        <rect x="300" y="88" width="112" height="72" rx="6"/>
        <rect x="700" y="88" width="76" height="72" rx="6"/>
      </g>
      <!-- agent steps -->
      <g fill="#e3e6e9" stroke="#525b65" stroke-width="1">
        <rect x="156" y="232" width="112" height="72" rx="6"/>
        <rect x="300" y="232" width="112" height="72" rx="6"/>
      </g>
      <!-- build loop -->
      <rect x="436" y="200" width="240" height="200" rx="8" fill="rgba(51,134,211,0.10)" stroke="#3386d3" stroke-width="1.2"/>
      <g fill="#e3e6e9" stroke="#525b65" stroke-width="1">
        <rect x="452" y="252" width="88" height="52" rx="6"/>
        <rect x="572" y="252" width="88" height="52" rx="6"/>
        <rect x="572" y="332" width="88" height="52" rx="6"/>
        <rect x="452" y="332" width="88" height="52" rx="6"/>
      </g>

      <!-- names -->
      <g font-family="Figtree, system-ui, sans-serif" font-size="12" font-weight="500" fill="#091b28" text-anchor="middle">
        <text x="78" y="120">Write delta</text>
        <text x="212" y="120">Resolve lines</text>
        <text x="356" y="120">Accept claims</text>
        <text x="738" y="120">Complete</text>
        <text x="212" y="264">Review</text>
        <text x="356" y="264">Plan</text>
        <text x="496" y="272">Runner</text>
        <text x="616" y="272">Lint</text>
        <text x="616" y="352">Review</text>
        <text x="496" y="352">Commit</text>
        <text x="452" y="224" text-anchor="start" font-weight="700">Build</text>
      </g>
      <!-- sublabels -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#525b65" text-anchor="middle">
        <text x="78" y="136">intent · claims</text>
        <text x="212" y="136">delete when fixed</text>
        <text x="356" y="136">[proposed] markers</text>
        <text x="738" y="136">immutable</text>
        <text x="212" y="280">lemma review</text>
        <text x="356" y="280">lemma plan</text>
        <text x="496" y="286">fresh attempt</text>
        <text x="616" y="286">coverage · shape</text>
        <text x="616" y="296">claim→test refs</text>
        <text x="616" y="366">per task</text>
        <text x="496" y="366">one per task</text>
        <text x="452" y="238" text-anchor="start">lemma build · each unticked task</text>
      </g>
    </svg>
